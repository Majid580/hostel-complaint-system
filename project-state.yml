      - { id: P9-8, task: "Clean typecheck + lint + build", status: done, note: "session-02: all three clean. Lint's first run found 8 errors: 4 setState-in-effect (fixed properly — a useHydrated hook via useSyncExternalStore, derived loading state, nav close on click), 3 Date.now()-during-render in server components (justified eslint-disable, they render once per request), 1 dead helper removed." }

