      - { id: P10-8, task: "Weekly mongodump backup GitHub Action", status: done, note: "session-08: .github/workflows/backup.yml. Encrypted (AES-256, PBKDF2) before it leaves the runner — the dump carries password hashes and student PII. Publishes to a squashed `backups` branch so history never grows; VERIFIED with a 10-run local simulation (git against a local bare repo, no GitHub calls) that the retention window holds and the branch stays at exactly 1 commit throughout. The tools download URL and the openssl encrypt/decrypt round-trip were both verified live, not assumed." }

# -----------------------------------------------------------------------------
# ENVIRONMENT VARIABLES (keep in sync with .env.example)
# -----------------------------------------------------------------------------
env_vars:
  status: "No .env.local exists yet. Copy .env.example to .env.local and fill it in."
  required:
    - MONGODB_URI
    - JWT_SECRET
    - NEXT_PUBLIC_APP_URL
  media:
    - CLOUDINARY_CLOUD_NAME
    - CLOUDINARY_API_KEY
    - CLOUDINARY_API_SECRET
    - NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME
  email:
    - MAIL_PROVIDER          # console | smtp | resend
    - MAIL_FROM
    - SMTP_HOST
    - SMTP_PORT
    - SMTP_SECURE
    - SMTP_USER
    - SMTP_PASS
    - RESEND_API_KEY         # only when MAIL_PROVIDER=resend
  cron:
    - CRON_SECRET
  seeding:
    - SEED_DEFAULT_PASSWORD
    - SEED_DEMO_DATA
    - "SEED_RT_GIRLS_EMAIL / SEED_RT_QASIM_EMAIL / SEED_RT_FATIMA_EMAIL"
    - "SEED_WARDEN_EMAIL / SEED_COORDINATOR_EMAIL"
    - "matching *_NAME variables are also read by scripts/seed.ts"
  branding:
    - NEXT_PUBLIC_INSTITUTE_NAME
    - NEXT_PUBLIC_APP_NAME

# -----------------------------------------------------------------------------
# ACCEPTANCE CRITERIA — the real completion test.
# All of these require a live database. None have been executed.
# -----------------------------------------------------------------------------
acceptance:
  - { id: AC-1,  check: "Student registers with 2023-CS-580, signs in, files a complaint with 3 photos and a voice note", status: done, note: "session-05: COMPLETE. A real photo and a real voice note were uploaded straight to Cloudinary with the app-generated signature and attached to HCMS-2026-000010; both render on the detail page. Previously text-only." }
  - { id: AC-2,  check: "The RT of that hostel and the Warden both receive the e-mail within a minute", status: done, note: "session-03: rt.fatima@example.edu AND warden@example.edu both received it. MAIL_PROVIDER=console so this was verified in the server log; real delivery still needs SMTP (BLK-3)." }
  - { id: AC-3,  check: "The complaint appears in the RT queue sorted by priority (severity + age)", status: done, note: "session-03: queue came back priority-sorted 140 > 85 > 67, and the RT saw only FATIMA." }
  - { id: AC-4,  check: "The RT of Qasim cannot see or mutate a Fatima complaint (404 on read, 403 on write)", status: done, note: "session-03: isolation enforced. NOTE — the write returns 404, not the 403 this criterion predicted, because loadComplaint checks visibility first. 404 is the better answer: a 403 would confirm the complaint exists. The criterion wording was wrong, not the code." }
  - { id: AC-5,  check: "RT assigns a worker; the student sees the assignment and the timeline updates", status: done, note: "session-03: worker assigned, status -> ASSIGNED, student saw it. The serializer redacts the worker phone from students." }
  - { id: AC-6,  check: "The student panel is read-only on status — no student can change a status directly", status: done, note: "session-03: student got 403 FORBIDDEN on role grounds and 409 ILLEGAL_TRANSITION on state-machine grounds. Both layers hold." }
  - { id: AC-7,  check: "After 24 h with no action the student can escalate to the Warden and the Warden is e-mailed", status: done, note: "session-03: 30 h old untouched complaint escalated to level 1; Warden and RT both e-mailed." }
  - { id: AC-8,  check: "RT marks RESOLVED; 24 h later the student flags a false resolution; the complaint reopens as disputed and the Warden + Coordinator are alerted", status: done, note: "session-03: RESOLVED -> REOPENED, isDisputed true, escalation level 1." }
  - { id: AC-9,  check: "Auto-close fires 72 h after RESOLVED with no student response", status: done, note: "session-03: the sweep auto-closed a complaint resolved 80 h earlier, verification.method = AUTO." }
  - { id: AC-10, check: "SLA breaches are flagged by the sweep and surface on the Warden dashboard", status: done, note: "session-03: one sweep flagged 3 new breaches; they surface on the dashboard and in the new digest." }
  - { id: AC-11, check: "Warden and Coordinator see all three hostels; the Coordinator can manage users and settings", status: done, note: "session-03: both saw all 3 hostels. Warden got 403 on user management and settings write; Coordinator got 200 on both." }
  - { id: AC-12, check: "Every state change is recorded in an append-only timeline visible to the student", status: done, note: "session-03: CREATED -> STATUS_CHANGED -> WORKER_ASSIGNED visible to the student; 18 events across the walkthrough." }
  - { id: AC-13, check: "The public transparency board shows per-hostel statistics without a login", status: done, note: "session-03: public board rendered real per-hostel figures with no session." }
  - { id: AC-14, check: "The whole system runs on free tiers with zero cost", status: pending, note: "The only one of the 16 still open. Not runtime-checkable until something is actually deployed — every dependency chosen IS on a permanent free tier (Vercel Hobby, Atlas M0, Cloudinary free, Gmail SMTP, GitHub Actions), but that is a design claim until P10-6 happens and the running costs table in docs/DEPLOYMENT.md is confirmed against a real bill (of $0)." }
  - { id: AC-15, check: "npx tsc --noEmit and npx next build both pass with no errors", status: done }
  - { id: AC-16, check: "npm run lint passes", status: done }

