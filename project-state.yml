      - { id: P9-3, task: "Global error boundary, not-found page, graceful database-down page", status: done, note: "session-02: src/app/{error,global-error,not-found}.tsx. The database-down case is handled where it matters — /transparency catches its own read; error.tsx covers the rest and shows the digest reference." }
