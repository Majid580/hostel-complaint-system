# -----------------------------------------------------------------------------
# DOMAIN CONSTANTS (the contract the code honours — src/lib/domain/constants.ts)
# These are DEFAULTS; the Coordinator can change them at runtime via /staff/settings.
# -----------------------------------------------------------------------------
domain:
  hostels: [GIRLS, QASIM, FATIMA]
  roles: [STUDENT, RT, WARDEN, COORDINATOR]
  reg_no_format: "SESSION-DEPT-ROLL e.g. 2023-CS-580"
  # Confirmed for UET Narowal (session-07) and ENFORCED at sign-up — the regex
  # only checks shape, so this list is what stops 2023-XYZ-001 becoming a user.
  # The Coordinator can edit it under System settings without a deployment.
  departments: [CS, BSCPE, EE, ARCH, CE, ME, BME]
  reg_no_regex: "^(19|20)\\d{2}-[A-Z]{2,5}-\\d{1,4}$"
  complaint_code_format: "HCMS-YYYY-NNNNNN e.g. HCMS-2026-000123"
  statuses:
    - SUBMITTED
    - ACKNOWLEDGED
    - ASSIGNED
    - IN_PROGRESS
    - ON_HOLD
    - RESOLVED
    - VERIFIED_CLOSED
    - REOPENED
    - REJECTED
  severities: [LOW, MEDIUM, HIGH, CRITICAL]
  escalation_levels: { 0: none, 1: warden, 2: coordinator }
  categories:
    - ELECTRICITY
    - PLUMBING_WATER
    - INTERNET_WIFI
    - FURNITURE
    - CLEANLINESS_SANITATION
    - MESS_FOOD
    - SECURITY_SAFETY
    - LAUNDRY
    - AC_HEATING_FAN
    - PEST_CONTROL
    - CIVIL_STRUCTURAL
    - GAS
    - LIFT_ELEVATOR
    - NOISE_DISCIPLINE
    - OTHER
  trades:
    - ELECTRICIAN
    - PLUMBER
    - CARPENTER
    - MASON
    - CLEANER
    - IT_NETWORK
    - AC_TECHNICIAN
    - PEST_CONTROL
    - SECURITY
    - GENERAL
  sla_hours:
    CRITICAL: { acknowledge: 2, resolve: 8 }
    HIGH:     { acknowledge: 4, resolve: 24 }
    MEDIUM:   { acknowledge: 12, resolve: 72 }
    LOW:      { acknowledge: 24, resolve: 168 }
  escalation_windows_hours:
    student_escalate_after: 24       # G6
    false_resolution_flag_after: 24  # G7
    auto_escalate_stale_after: 24
    level2_after: 48
    auto_close_resolved_after: 72
    warden_reopen_window_days: 7
    escalation_cooldown: 24
  attachment_limits:
    images_max_count: 5
    image_max_mb: 5
    audio_max_count: 1
    audio_max_mb: 10
    audio_max_seconds: 120

# -----------------------------------------------------------------------------
# TECH STACK (installed versions, verified from package.json)
# -----------------------------------------------------------------------------
stack:
  runtime: "Node 25.6.1, npm 11.9.0"
  framework: "Next.js 16.3.4 (App Router) + React 19.2.8 + TypeScript 5"
  ui: "Tailwind CSS v4 + hand-written Radix primitives + lucide-react + sonner + next-themes"
  database: "MongoDB Atlas M0 (free) via Mongoose 9.9.4"
  auth: "jose JWT in an httpOnly cookie + bcryptjs"
  validation: "Zod 4.5.4"
  media: "Cloudinary free tier, signed direct browser upload (adapter in src/lib/storage/)"
  email: "Nodemailer SMTP (Gmail / Brevo), plus Resend and console adapters (src/lib/mail/)"
  charts: "Recharts"
  hosting: "Vercel Hobby (free)"
  scheduler: "GitHub Actions cron every 15 min -> POST /api/cron/sweep (guarded by CRON_SECRET)"
  package_manager: npm
  gotchas:
    - "Mongoose 9 no longer exports the FilterQuery type; queries are typed Record<string, unknown> and cast at the call site."
    - "next/image is used with `unoptimized` on Cloudinary URLs on purpose: Vercel's free image-optimisation quota is small and Cloudinary already transforms."
    - "bcryptjs, not bcrypt — the free build server must never compile native code."
    - "Bash heredocs in this environment mangle some quoted content; write large files with the Write tool."
    - "querySrv ECONNREFUSED does NOT mean the Atlas cluster is down. mongodb+srv://
       needs a DNS SRV lookup and this ISP's resolver REFUSES SRV queries — it
       answers with a referral. Verify with
       `nslookup -type=SRV _mongodb._tcp.<cluster>.mongodb.net 8.8.8.8`; if Google
       DNS answers and the default resolver does not, that is the cause. .env.local
       therefore uses the non-SRV form listing the three replica-set members.
       Vercel resolves SRV correctly, so production can use either."
    - "The `middleware` file convention is DEPRECATED in Next 16. This project uses
       src/proxy.ts exporting `proxy()` (migrated in session-03). Do not recreate
       src/middleware.ts."
    - "React throttles Suspense reveals behind requestAnimationFrame. In a headless
       or hidden browser tab rAF never fires, so any page with a loading.tsx looks
       permanently stuck. That is the harness, not the app — check with a visible
       tab, or flush it manually with $RV($RB)."

# -----------------------------------------------------------------------------
# DESIGN SYSTEM (session-06) — read before touching the UI
# -----------------------------------------------------------------------------
design:
  direction: "Ink & Signal"
  governing_rule: >
    Colour is VOCABULARY in this product. Red, amber and green mean severity and
    SLA state, and the brand may never spend them. The old teal sat between
    "info blue" and "success green" and blurred the one signal students rely on;
    indigo was chosen because it collides with nothing. If you add a brand
    accent, it must stay outside the semantic hues.
  palette: "Warm paper ground + deep blue-black ink + indigo primary. Neutrals
            carry the personality since the accent cannot."
  type: >
    IBM Plex, one family in three roles — Sans Condensed for display, Sans for
    body, Mono for codes, timestamps and countdowns. The condensed cut is not
    only characterful: it buys ~15% horizontal room, which matters more than
    anything else at 360px.
  signature: >
    The job tag (.job-tag in globals.css) — a complaint's code rendered as a
    physical maintenance tag. It is the one string a student writes down and
    quotes back, so it is treated as an artifact rather than as small print.
  mobile_rules:
    - "Bottom tab bar under lg; sidebar at lg and up. Five tabs maximum, then a
       More sheet. The hamburger drawer is gone — do not reintroduce it."
    - "Pages must end with .pb-nav so the last card clears the tab bar."
    - "Inputs are 16px under sm or iOS zooms the page on focus."
    - "Tables scroll horizontally with a fade edge; they never crush columns."
    - "Stat blocks are rails, not 2x2 card grids — four numbers should not cost
       half a screen."

# -----------------------------------------------------------------------------
# PERFORMANCE (measured session-04, production build, median of 5 warm requests)
#
# The cluster is ~120-300 ms away per round trip, so page time is dominated by
# HOW MANY database round trips a request makes, not by query complexity.
# Optimise by removing round trips, never by micro-tuning queries.
# -----------------------------------------------------------------------------
performance:
  db_round_trip_ms: "120-300 (free M0, remote region). Cold connect ~1.9 s."
  measured:
    "/":                 { before_ms: 480, after_ms: 9 }
    "/transparency":     { before_ms: 390, after_ms: 9 }
    "/api/auth/me":      { before_ms: 230, after_ms: 4 }
    "/staff":            { before_ms: 760, after_ms: 141 }
    "/staff/complaints": { before_ms: 400, after_ms: 136 }
    "/staff/analytics":  { before_ms: 830, after_ms: 255 }
    "/staff/users":      { before_ms: 290, after_ms: 129 }
    "/api/complaints":   { before_ms: 400, after_ms: 136 }
    "/api/notifications": { before_ms: 246, after_ms: 126 }
  what_was_done:
    - "getSession/getCurrentUser wrapped in React cache() — a page and its layout
       were each doing the same session query."
    - "Cross-request session cache in the warm container, SESSION_CACHE_TTL_MS
       (default 15000, set 0 to disable). Removes the ~130 ms floor every
       authenticated request used to pay. invalidateUserSession() is called on
       password change, password reset and deactivation, so revocation stays
       immediate on that instance; other instances lag by at most the TTL."
    - "getPublicStats cached 120 s and its two aggregations parallelised."
    - "maxPoolSize 5 -> 12: the dashboard fires ~12 parallel queries and a pool
       of 5 forced three sequential waves. minPoolSize 0 -> 1 keeps one
       connection warm."
    - "Dashboard lists pass withTotal:false — three countDocuments calls whose
       results were never rendered."
    - "GET /api/notifications runs its count and find in parallel; the countOnly
       poll path stays a single query."
    - "Header bell no longer re-polls on every navigation and pauses while the
       tab is hidden."
  biggest_remaining_lever: >
    Cluster region. Every remaining page is one round trip (~130 ms) from
    instant. If the Atlas region is far from the users and from the Vercel
    deployment region, moving it closer is worth more than any further code
    change. Check it in the Atlas UI before optimising anything else.

